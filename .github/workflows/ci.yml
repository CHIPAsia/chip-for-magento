name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Syntax (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5', '8.6' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: php -l on every PHP file
        run: |
          status=0
          while IFS= read -r -d '' file; do
            out=$(php -d error_reporting=E_ALL -d display_errors=stderr -l "$file" 2>&1) || { printf '%s\n' "$out"; status=1; }
          done < <(find . -name '*.php' -not -path './.git/*' -print0)
          exit $status

      - name: Manifests parse
        run: |
          php -r 'exit(simplexml_load_file("etc/module.xml") ? 0 : 1);'
          php -r 'json_decode(file_get_contents("composer.json"), true, 512, JSON_THROW_ON_ERROR);'

  smoke:
    name: Smoke tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.1', '8.4' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: openssl

      - name: Run tests/smoke.php
        run: php tests/smoke.php

  deprecations:
    name: Deprecation scan (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.4', '8.5', '8.6' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Fail when php -l reports a deprecation
        # Informational until the implicit-nullable fix on main lands (#5):
        # the step fails and prints the notice, but does not block the PR.
        continue-on-error: true
        run: |
          hits=0
          while IFS= read -r -d '' file; do
            out=$(php -d error_reporting=E_ALL -d display_errors=stderr -l "$file" 2>&1)
            if printf '%s' "$out" | grep -q 'Deprecated:'; then
              printf '%s\n\n' "$out"
              hits=1
            fi
          done < <(find . -name '*.php' -not -path './.git/*' -print0)
          exit $hits
